<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植语者测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #FAF8F3;
  --sage: #8FA68E;
  --sage-light: #E8EDE7;
  --bark: #7A5C3C;
  --bark-light: #F0E8DD;
  --blossom: #C97B8A;
  --blossom-light: #F5E5E8;
  --ink: #2C2C2C;
  --ink-soft: #5A5A5A;
  --ink-faint: #9A9A9A;
  --border: #E5E0D8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; min-height: 100vh;
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--cream);
  color: var(--ink);
  overflow-x: hidden;
}
#bg-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.container {
  position: relative; z-index: 1;
  max-width: 640px; margin: 0 auto;
  padding: 48px 24px;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.page {
  display: none; width: 100%;
  animation: pageEnter 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.page.active { display: flex; flex-direction: column; align-items: center; }
@keyframes pageEnter {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.intro-scene {
  perspective: 1200px;
  transform-style: preserve-3d;
  display: flex; align-items: center; justify-content: center;
  gap: 28px; margin-bottom: 40px;
  height: 160px;
}
.intro-icon {
  width: 100px; height: 100px;
  display: flex; align-items: center; justify-content: center;
  animation: iconFloat 4s ease-in-out infinite;
  animation-delay: var(--d);
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  cursor: default;
}
.intro-icon:hover {
  transform: scale(1.12) translateZ(40px) rotateY(8deg);
}
.intro-icon img {
  width: 80px; height: 80px;
  object-fit: contain;
}
@keyframes iconFloat {
  0%, 100% { transform: translateY(0) rotateY(0deg); }
  50% { transform: translateY(-14px) rotateY(6deg); }
}
.intro-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 36px; font-weight: 600;
  color: var(--ink); letter-spacing: 6px;
  margin-bottom: 8px; text-align: center;
}
.intro-subtitle {
  font-size: 15px; font-weight: 300;
  color: var(--ink-soft); letter-spacing: 2px;
  margin-bottom: 40px; text-align: center;
}
.btn-start {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 16px; font-weight: 500;
  color: white; background: var(--ink);
  border: none; padding: 14px 48px;
  border-radius: 100px; cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 4px 20px rgba(44,44,44,0.12);
}
.btn-start:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px rgba(44,44,44,0.18);
}
.intro-hint {
  margin-top: 20px; font-size: 12px;
  color: var(--ink-faint); letter-spacing: 1px;
}

.progress-area {
  width: 100%; max-width: 520px;
  margin-bottom: 32px;
}
.progress-track {
  width: 100%; height: 3px;
  background: var(--border); border-radius: 2px;
  overflow: hidden; margin-bottom: 10px;
}
.progress-fill {
  height: 100%; background: var(--ink);
  border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  width: 10%;
}
.progress-meta {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--ink-faint);
  letter-spacing: 1px;
}
.quiz-card {
  width: 100%; max-width: 520px;
  background: white;
  border-radius: 20px;
  padding: 36px 32px;
  box-shadow: 0 2px 24px rgba(0,0,0,0.04);
  border: 1px solid var(--border);
  transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.question-label {
  font-size: 11px; font-weight: 500;
  color: var(--ink-faint); letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.question-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px; font-weight: 500;
  line-height: 1.7; color: var(--ink);
  margin-bottom: 28px;
}
.options-list {
  display: flex; flex-direction: column; gap: 12px;
}
.option-item {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 16px 18px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: white;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  text-align: left;
  font-family: inherit; font-size: 15px;
  line-height: 1.7; color: var(--ink-soft);
  width: 100%;
}
.option-item:hover {
  border-color: var(--ink);
  background: #FAFAFA;
  transform: translateX(6px);
  color: var(--ink);
}
.option-item:active { transform: scale(0.985); }
.option-dot {
  width: 22px; height: 22px;
  border-radius: 50%; border: 1.5px solid var(--border);
  flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600;
  color: var(--ink-faint);
  transition: all 0.3s ease;
}
.option-item:hover .option-dot {
  border-color: var(--ink); background: var(--ink); color: white;
}

.result-card {
  width: 100%; max-width: 520px;
  text-align: center;
}
.result-icon-wrap {
  width: 120px; height: 120px;
  margin: 0 auto 24px;
  display: flex; align-items: center; justify-content: center;
  animation: resultPop 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.result-icon-wrap img {
  width: 100px; height: 100px;
  object-fit: contain;
}
@keyframes resultPop {
  0% { transform: scale(0) rotate(-12deg); opacity: 0; }
  60% { transform: scale(1.08) rotate(3deg); }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.result-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px; font-weight: 600;
  margin-bottom: 6px;
}
.result-tagline {
  font-size: 14px; font-weight: 300;
  color: var(--ink-soft); letter-spacing: 2px;
  margin-bottom: 28px;
}
.result-quote {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px; line-height: 2;
  color: var(--ink-soft);
  text-align: left;
  padding: 24px 28px;
  border-radius: 16px;
  background: white;
  border: 1px solid var(--border);
  margin-bottom: 32px;
  position: relative;
}
.result-quote::before {
  content: """;
  font-family: 'Noto Serif SC', serif;
  font-size: 48px; color: var(--border);
  position: absolute; top: 8px; left: 16px;
  line-height: 1;
}
.score-section {
  margin-bottom: 32px; width: 100%;
}
.score-title {
  font-size: 12px; font-weight: 500;
  color: var(--ink-faint); letter-spacing: 3px;
  margin-bottom: 16px; text-transform: uppercase;
}
.score-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.score-name {
  width: 56px; font-size: 13px;
  color: var(--ink-soft); text-align: right;
  font-weight: 500;
}
.score-track {
  flex: 1; height: 6px;
  background: var(--border); border-radius: 3px;
  overflow: hidden;
}
.score-bar {
  height: 100%; border-radius: 3px;
  transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  width: 0%;
}
.score-num {
  width: 40px; font-size: 13px;
  color: var(--ink-faint); text-align: left;
  font-variant-numeric: tabular-nums;
}
.btn-restart {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px; font-weight: 400;
  color: var(--ink-soft); background: transparent;
  border: 1px solid var(--border);
  padding: 10px 32px; border-radius: 100px;
  cursor: pointer; letter-spacing: 2px;
  transition: all 0.3s ease;
}
.btn-restart:hover {
  border-color: var(--ink); color: var(--ink);
  background: white;
}

@media (max-width: 480px) {
  .container { padding: 32px 16px; }
  .intro-title { font-size: 28px; }
  .quiz-card { padding: 28px 20px; }
  .question-text { font-size: 18px; }
  .intro-scene { gap: 16px; }
  .intro-icon { width: 80px; height: 80px; }
  .intro-icon img { width: 64px; height: 64px; }
}
</style>
</head>

var currentQ = 0;
var scores = { flower: 0, leaf: 0, stem: 0 };

function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  currentQ = 0;
  scores = { flower: 0, leaf: 0, stem: 0 };
  showPage('page-quiz');
  renderQuestion();
}

function renderQuestion() {
  var q = questions[currentQ];
  document.getElementById('question-label').textContent = 'QUESTION ' + String(currentQ + 1).padStart(2, '0');
  document.getElementById('question-text').textContent = q.q;
  document.getElementById('progress-num').textContent = String(currentQ + 1).padStart(2, '0') + ' / ' + questions.length;
  document.getElementById('progress-fill').style.width = ((currentQ + 1) / questions.length * 100) + '%';

  var list = document.getElementById('options-list');
  list.innerHTML = '';
  var labels = ['A', 'B', 'C'];
  q.options.forEach(function(opt, i) {
    var btn = document.createElement('button');
    btn.className = 'option-item';
    btn.style.animation = 'pageEnter ' + (0.3 + i * 0.12) + 's cubic-bezier(0.22,1,0.36,1) both';
    btn.innerHTML = '<span class="option-dot">' + labels[i] + '</span><span>' + opt.text + '</span>';
    btn.onclick = function() { selectOption(opt.type); };
    list.appendChild(btn);
  });
}

function selectOption(type) {
  scores[type]++;
  currentQ++;
  if (currentQ < questions.length) {
    var card = document.getElementById('quiz-card');
    card.style.transform = 'translateX(-30px) rotateY(-8deg)';
    card.style.opacity = '0';
    setTimeout(function() {
      renderQuestion();
      card.style.transition = 'none';
      card.style.transform = 'translateX(30px) rotateY(8deg)';
      setTimeout(function() {
        card.style.transition = 'all 0.5s cubic-bezier(0.22, 1, 0.36, 1)';
        card.style.transform = 'translateX(0) rotateY(0)';
        card.style.opacity = '1';
      }, 40);
    }, 350);
  } else {
    showResult();
  }
}

function showResult() {
  showPage('page-result');

  var maxScore = Math.max(scores.flower, scores.leaf, scores.stem);
  var winner = 'flower';
  if (scores.leaf === maxScore && scores.leaf >= scores.flower) winner = 'leaf';
  if (scores.stem === maxScore && scores.stem >= scores.leaf && scores.stem >= scores.flower) winner = 'stem';

  var r = resultData[winner];
  document.getElementById('result-icon-wrap').innerHTML = '<img src="' + r.icon + '" alt="">';
  document.getElementById('result-name').textContent = r.name;
  document.getElementById('result-name').style.color = r.color;
  document.getElementById('result-tagline').textContent = r.tagline;
  document.getElementById('result-quote').textContent = r.quote;

  var chart = document.getElementById('score-chart');
  chart.innerHTML = '';
  var types = [
    { key: 'flower', label: '花系', color: 'var(--blossom)' },
    { key: 'leaf', label: '叶系', color: 'var(--sage)' },
    { key: 'stem', label: '茎系', color: 'var(--bark)' }
  ];
  types.forEach(function(t) {
    var pct = Math.round(scores[t.key] / questions.length * 100);
    var row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = '<span class="score-name">' + t.label + '</span><div class="score-track"><div class="score-bar" style="width:0%;background:' + t.color + '"></div></div><span class="score-num">' + pct + '%</span>';
    chart.appendChild(row);
    setTimeout(function() {
      row.querySelector('.score-bar').style.width = pct + '%';
    }, 400);
  });
}

function restartQuiz() {
  startQuiz();
}

var canvas = document.getElementById('bg-canvas');
var ctx = canvas.getContext('2d');
var particles = [];
var W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function Particle() { this.reset(); }
Particle.prototype.reset = function() {
  this.x = Math.random() * W;
  this.y = Math.random() * H - H;
  this.size = Math.random() * 2.5 + 0.5;
  this.speed = Math.random() * 0.4 + 0.15;
  this.sway = Math.random() * 1.5 - 0.75;
  this.swaySpeed = Math.random() * 0.015 + 0.005;
  this.time = Math.random() * 100;
  var colors = ['#C97B8A', '#8FA68E', '#7A5C3C', '#D4A5A5', '#A8C4A0'];
  this.color = colors[Math.floor(Math.random() * colors.length)];
  this.opacity = Math.random() * 0.12 + 0.03;
};
Particle.prototype.update = function() {
  this.y += this.speed;
  this.time += this.swaySpeed;
  this.x += Math.sin(this.time) * this.sway;
  if (this.y > H + 10) this.reset();
};
Particle.prototype.draw = function() {
  ctx.globalAlpha = this.opacity;
  ctx.fillStyle = this.color;
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
  ctx.fill();
};

for (var i = 0; i < 50; i++) particles.push(new Particle());

function animate() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach(function(p) { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}
animate();
</script>
